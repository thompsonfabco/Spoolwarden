name: android
on:
  push:
    branches: ['**']
    tags: ['**']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: [self-hosted, Linux, X64, testbox-linux]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3.2.2
        with:
          # the default also asks for the legacy 'tools' package, which current sdkmanager no longer has;
          # AGP downloads the platform and build-tools it needs itself
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      # Maven Central can answer HTTP 429 for a dependency jar. This step only downloads what the build and its unit tests resolve (the same
      # classpaths), up to three tries with a pause; if it still fails it only warns, and the build step below resolves again and fails by itself.
      - name: Download dependencies
        run: |
          cat > "$RUNNER_TEMP/fk-resolve.gradle" <<'EOF'
          allprojects {
            tasks.register("fkResolveDependencies") {
              doLast {
                ["debugCompileClasspath", "debugRuntimeClasspath", "debugUnitTestCompileClasspath", "debugUnitTestRuntimeClasspath"].each { name ->
                  def c = project.configurations.findByName(name)
                  // only the downloaded libraries (not the project's own outputs): the build and the unit tests need their files
                  if (c != null) c.incoming.artifactView { componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier } }.files.files
                }
              }
            }
          }
          EOF
          for attempt in 1 2 3; do
            timeout 10m ./gradlew --no-daemon --max-workers=24 --init-script "$RUNNER_TEMP/fk-resolve.gradle" fkResolveDependencies && exit 0
            echo "::warning::dependency download failed (attempt $attempt of 3)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 60))
          done
          echo "::warning::the dependencies could not be downloaded in advance; the next step resolves them again"
          exit 0
      # Robolectric downloads the android-all runtime jar of every SDK level the tests use at TEST time, into ~/.m2 (outside Gradle's cache, so
      # the cache above does not cover it); one of them failed a run on a Maven Central error. Fill it here, retried: one test class per SDK level (each distinct @Config(sdk = [...]) in the tests, and a class without
      # @Config for Robolectric's default level), run by Gradle itself, so the layout is Robolectric's own. Warns and goes on if all tries fail.
      # Try 2 fetches from the Google mirror of Maven Central (same paths) instead of repo1.maven.org: the tests of one SDK level failed on all
      # three tries from the runner (HTTP error from Maven Central) while the other levels downloaded fine. The property goes in through
      # JAVA_TOOL_OPTIONS, so Gradle prints "Picked up JAVA_TOOL_OPTIONS" lines (harmless). A failed try prints the cause from the test report.
      - name: Download the Robolectric runtime
        run: |
          if [ -d "$HOME/.m2/repository/org/robolectric/android-all-instrumented" ] && find "$HOME/.m2/repository/org/robolectric/android-all-instrumented" -name '*.jar' -print -quit | grep -q .; then
            echo "Robolectric runtime jars already cached in ~/.m2; skipping warm-up"
            exit 0
          fi
          src=app/src/test/java
          tests=()
          add() { if [ -n "$1" ]; then tests+=(--tests "*.$(basename "${1%.*}")"); fi; }
          while IFS= read -r sdk; do
            add "$(grep -rlF -- "$sdk" "$src" | head -n 1)"
          done < <(grep -rhoE 'sdk = \[[^]]*\]' "$src" | sort -u)
          mapfile -t robo_files < <(grep -rlE 'RunWith\((Robolectric|AndroidJUnit4)' "$src" || true)
          if [ "${#robo_files[@]}" -gt 0 ]; then
            add "$(grep -rLF '@Config(' "${robo_files[@]}" | head -n 1)"
          fi
          echo "warm-up classes: ${tests[*]}"
          [ "${#tests[@]}" -gt 0 ] || exit 0
          mirror=https://maven-central.storage-download.googleapis.com/maven2
          for attempt in 1 2 3; do
            opts=""
            [ "$attempt" -eq 2 ] && opts="-Drobolectric.dependency.repo.url=$mirror -Drobolectric.dependency.repo.id=google-mirror"
            # --no-build-cache --rerun: the tests must really run here, a cached result downloads nothing
            JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:-} $opts" timeout 10m ./gradlew --no-daemon --max-workers=24 testDebugUnitTest --no-build-cache --rerun "${tests[@]}" && exit 0
            echo "::warning::Robolectric runtime download failed (attempt $attempt of 3)"
            echo "cause (from the test report):"
            { grep -hE 'Server returned HTTP response code|FileNotFoundException|IOException|UnknownHost|ConnectException|SocketTimeout|SSLException' app/build/test-results/testDebugUnitTest/*.xml || true; } | sort -u | head -n 4 | cut -c1-300
            [ "$attempt" -lt 3 ] && sleep $((attempt * 60))
          done
          echo "::warning::the Robolectric runtime could not be downloaded in advance; the tests try again themselves"
          exit 0
      # --no-build-cache: the Gradle cache restored above also holds Gradle's build cache, which hands back old test results
      # (":app:testDebugUnitTest FROM-CACHE") and runs no test at all
      - run: timeout 25m ./gradlew --no-daemon testDebugUnitTest assembleDebug --no-build-cache
      - name: Verify executed unit tests
        run: |
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          files = sorted(glob.glob("app/build/test-results/**/*.xml", recursive=True))
          total = 0
          for f in files:
              root = ET.parse(f).getroot()
              if root.tag == "testsuite":
                  total += int(root.attrib.get("tests", 0))
              else:
                  for ts in root.findall(".//testsuite"):
                      total += int(ts.attrib.get("tests", 0))
          print(f"Executed Android unit tests: {total} (from {len(files)} XML files)")
          if total <= 0:
              sys.exit("error: zero Android unit tests executed")
          EOF
      - name: Upload unit test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: android-test-results
          path: android/app/build/test-results/
