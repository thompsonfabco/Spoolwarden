name: android
on:
  push:
    branches: ['**']
    tags: ['**']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          # the Gradle dependency cache (keyed on the build files): Maven Central answered HTTP 429 for a test runtime jar and failed three
          # runs before any test ran; a cache hit downloads nothing
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties
            android/gradle/libs.versions.toml
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3.2.2
        with:
          # the default also asks for the legacy 'tools' package, which current sdkmanager no longer has;
          # AGP downloads the platform and build-tools it needs itself
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      # Maven Central can answer HTTP 429 for a dependency jar. This step only downloads what the build and its unit tests resolve (the same
      # classpaths), up to three tries with a pause; if it still fails it only warns, and the build step below resolves again and fails by itself.
      - name: Download dependencies
        run: |
          cat > "$RUNNER_TEMP/fk-resolve.gradle" <<'EOF'
          allprojects {
            tasks.register("fkResolveDependencies") {
              doLast {
                ["debugCompileClasspath", "debugRuntimeClasspath", "debugUnitTestCompileClasspath", "debugUnitTestRuntimeClasspath"].each { name ->
                  def c = project.configurations.findByName(name)
                  // only the downloaded libraries (not the project's own outputs): the build and the unit tests need their files
                  if (c != null) c.incoming.artifactView { componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier } }.files.files
                }
              }
            }
          }
          EOF
          for attempt in 1 2 3; do
            ./gradlew --init-script "$RUNNER_TEMP/fk-resolve.gradle" fkResolveDependencies && exit 0
            echo "::warning::dependency download failed (attempt $attempt of 3)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 60))
          done
          echo "::warning::the dependencies could not be downloaded in advance; the next step resolves them again"
          exit 0
      # Robolectric downloads the android-all runtime jar of every SDK level the tests use at TEST time, into ~/.m2 (outside Gradle's cache, so
      # the cache above does not cover it); one of them failed a run on a Maven Central error. Cache that folder ...
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/app/src/test/**/robolectric.properties') }}
          restore-keys: robolectric-android-all-${{ runner.os }}-
      # ... and fill it here, retried: one test class per SDK level (each distinct @Config(sdk = [...]) in the tests, and a class without
      # @Config for Robolectric's default level), run by Gradle itself, so the layout is Robolectric's own. Warns and goes on if all tries fail.
      - name: Download the Robolectric runtime
        run: |
          src=app/src/test/java
          tests=()
          add() { if [ -n "$1" ]; then tests+=(--tests "*.$(basename "${1%.*}")"); fi; }
          while IFS= read -r sdk; do
            add "$(grep -rlF -- "$sdk" "$src" | head -n 1)"
          done < <(grep -rhoE 'sdk = \[[^]]*\]' "$src" | sort -u)
          add "$(grep -rLF '@Config(' $(grep -rlE 'RunWith\((Robolectric|AndroidJUnit4)' "$src") | head -n 1)"
          echo "warm-up classes: ${tests[*]}"
          [ "${#tests[@]}" -gt 0 ] || exit 0
          for attempt in 1 2 3; do
            # --no-build-cache --rerun: the tests must really run here, a cached result downloads nothing
            ./gradlew testDebugUnitTest --no-build-cache --rerun "${tests[@]}" && exit 0
            echo "::warning::Robolectric runtime download failed (attempt $attempt of 3)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 60))
          done
          echo "::warning::the Robolectric runtime could not be downloaded in advance; the tests try again themselves"
          exit 0
      # --no-build-cache: the Gradle cache restored above also holds Gradle's build cache, which hands back old test results
      # (":app:testDebugUnitTest FROM-CACHE") and runs no test at all
      - run: ./gradlew testDebugUnitTest assembleDebug --no-build-cache
