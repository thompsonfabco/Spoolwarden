name: panel
on:
  push:
    branches: ['**']
    tags: ['**']
    paths: ['station/panel/**', '.github/workflows/panel.yml']
  pull_request:
    paths: ['station/panel/**', '.github/workflows/panel.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: [self-hosted, Linux, X64, testbox-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        run: pio --version 2>/dev/null | grep -q '6\.1\.18' || pip install platformio==6.1.18

      - name: Native unit tests (lib/panel_core)
        run: pio test -d station/panel -e native

      - name: Firmware build (ESP32-C3)
        run: pio run -d station/panel -e esp32-c3-supermini
