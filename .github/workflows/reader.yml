name: reader
on:
  push:
    branches: ['**']
    tags: ['**']
    paths: ['reader/**', '.github/workflows/reader.yml']
  pull_request:
    paths: ['reader/**', '.github/workflows/reader.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: [self-hosted, Linux, X64, testbox-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        run: (pio --version 2>/dev/null | grep -q '6\.1\.18' && python -c 'import pytest, xdist, cryptography' 2>/dev/null) || pip install platformio==6.1.18 pytest pytest-xdist cryptography

      - name: Native unit tests (lib/reader_core)
        run: pio test -d reader -e native

      - name: OTA publish tool tests
        run: pytest -q -n 16 -rfEs reader/tools

      - name: Firmware build (placeholder secrets)
        run: |
          cp reader/src/secrets.example.h reader/src/secrets.h
          pio run -d reader -e esp32-c3-supermini
          ls -l reader/.pio/build/esp32-c3-supermini/firmware.bin
